name: CI - Backend Legacy

# stable-release is the PRODUCTION branch (publishes @stable, consumed by the
# trading engine). It must run the same CI gate as main — its absence here meant
# every production publish shipped with zero test/lint/codegen-drift execution
# (audit B01-backend-legacy-01).
on:
  pull_request:
    branches: [main, develop, stable-release]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
  push:
    branches: [main, stable-release]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/**'

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      # src/generated/** is gitignored; lint passes without it but tsc and
      # the vitest suite resolve imports from it, so every checking job must
      # run the codegen chain first (mirrors the publish workflow's build).
      - name: Generate code from schema
        run: |
          npm run generate
          npm run fix-imports
          npm run generate:selections
          npm run generate:functions
          npm run generate:strings
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      # Type-checking the full surface incl. ~1.3M generated lines exceeds
      # the runner's default Node heap (observed OOM at exit 134); match the
      # publish workflow's allowance.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      # src/generated/** is gitignored; lint passes without it but tsc and
      # the vitest suite resolve imports from it, so every checking job must
      # run the codegen chain first (mirrors the publish workflow's build).
      - name: Generate code from schema
        run: |
          npm run generate
          npm run fix-imports
          npm run generate:selections
          npm run generate:functions
          npm run generate:strings
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  verify-generated-code:
    name: Verify Generated Code Matches Schema
    runs-on: ubuntu-latest
    env:
      # prisma validate/generate only need the datasource env vars to
      # RESOLVE (no connection is made); fall back to a syntactically valid
      # dummy so the job does not depend on repo secrets being configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Validate Prisma schema
        run: SKIP_PRISMA_VERSION_CHECK=true npx prisma validate

      - name: Generate code from schema
        run: |
          SKIP_PRISMA_VERSION_CHECK=true npx prisma generate
          node fix-import-paths.cjs
          npx ts-node src/modules/generateSelections.ts
          npx ts-node src/modules/index.ts
          npx ts-node src/modules/generateStrings.ts

      - name: Check for generated code drift
        # src/generated/** is gitignored, so diffing it can never detect
        # drift. The TRACKED generated surface is the per-model CRUD files
        # at src/*.ts (written by generate:functions) — regenerating from
        # the committed schema and diffing those is the real check. WARNING
        # only for now: the committed surface intentionally excludes the
        # in-flight investor-relations models (audit B01-backend-legacy-13);
        # escalate to a hard failure once that codegen lands.
        run: |
          if ! git diff --quiet -- 'src/*.ts'; then
            echo "::warning::Committed CRUD surface differs from a fresh regeneration of the committed schema (known in-flight divergence: investor-relations models, audit B01-13)."
            git diff --name-only -- 'src/*.ts'
            git diff --stat -- 'src/*.ts' | tail -3
          else
            echo "Committed CRUD surface matches the committed schema."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm run build
